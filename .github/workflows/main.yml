name: Deploy MultiK8s

on:
  push:
    branches: [main]

env:
  SHA: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Docker login
        run: |-
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -t rohansharma029/react-test -f ./client/Dockerfile.dev ./client
          docker run -e CI=true rohansharma029/react-test npm test

      - name: Set Service Account Key
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Set project
        run: gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
      - name: Auth
        run: |-
          gcloud --quiet auth configure-docker

      - name: Get Credentials
        uses: google-github-actions/get-gke-credentials@v0
        with:
          cluster_name: multi-cluster
          location: us-central1-c

      - name: Build
        run: |-
          docker build -t rohansharma029/multi-client-k8s-gh:latest -t rohansharma029/multi-client-k8s-gh:${{ env.SHA }} -f ./client/Dockerfile ./client
          docker build -t rohansharma029/multi-server-k8s-gh:latest -t rohansharma029/multi-server-k8s-gh:${{ env.SHA }} -f ./server/Dockerfile ./server
          docker build -t rohansharma029/multi-worker-k8s-gh:latest -t rohansharma029/multi-worker-k8s-gh:${{ env.SHA }} -f ./worker/Dockerfile ./worker

      - name: Push
        run: |-
          docker push rohansharma029/multi-client-k8s-gh:latest
          docker push rohansharma029/multi-server-k8s-gh:latest
          docker push rohansharma029/multi-worker-k8s-gh:latest

          docker push rohansharma029/multi-client-k8s-gh:${{ env.SHA }}
          docker push rohansharma029/multi-server-k8s-gh:${{ env.SHA }}
          docker push rohansharma029/multi-worker-k8s-gh:${{ env.SHA }}
